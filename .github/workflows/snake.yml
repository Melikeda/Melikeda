name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk@v3
        with:
          github_user_name: Melikeda
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=#0e4429&color_dots=#ffffff,#aceebb,#4ac26b,#2da44e,#116329&color_dot_border=#d0d7de

      - name: Style snake (GitHub contribution grid + fireworks finale)
        run: |
          sudo chown -R "$(id -u):$(id -g)" dist
          node scripts/style-snake.mjs dist/github-contribution-grid-snake.svg

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
